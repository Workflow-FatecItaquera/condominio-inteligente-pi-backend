spring.application.name=condominio-test

# Banco isolado e descartavel para os testes automatizados.
spring.datasource.url=jdbc:h2:mem:condominio;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Segredo sem valor real, usado somente no contexto de teste.
app.jwt.secret=chave-segura-exclusiva-para-testes-automatizados
app.jwt.expiration=86400000
