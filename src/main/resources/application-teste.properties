# Perfil "teste": banco H2 em memória, descartável, e relógio ajustável.
# Uso: ./gradlew bootRun --args='--spring.profiles.active=teste'
# Nunca aponta para o banco de produção.
spring.datasource.url=jdbc:h2:mem:condominio_teste;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
